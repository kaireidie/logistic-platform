spring:
  application:
    name: logisctic-platform

  datasource:
    url: jdbc:postgresql://192.168.56.101:5432/logisticsystem
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080