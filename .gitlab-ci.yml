stages:
  - test
  - smoke-test
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  interruptible: true

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - settings.gradle.kts
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

.gradle-job:
  image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
  before_script:
    - chmod +x gradlew

backend-test:
  extends: .gradle-job
  stage: test

  services:
    - name: postgres:17-alpine
      alias: postgres

  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password

    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test_db
    SPRING_DATASOURCE_USERNAME: test_user
    SPRING_DATASOURCE_PASSWORD: test_password

  script:
    - ./gradlew :test --no-daemon

  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/test-results/test/
      - build/reports/tests/test/


android-test:
  extends: .gradle-job
  stage: test

  script:
    - ./gradlew :android:app:lintDebug :android:app:testDebugUnitTest :android:app:assembleDebug --no-daemon

  artifacts:
    when: always
    reports:
      junit:
        - android/app/build/test-results/testDebugUnitTest/*.xml
    paths:
      - android/app/build/reports/
      - android/app/build/test-results/
      - android/app/build/outputs/apk/debug/


container-smoke-test:
  stage: smoke-test

  image: docker:27.5.1-cli

  services:
    - name: docker:27.5.1-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  needs:
    - backend-test
    - android-test

  script:
    - docker compose up --build --detach --wait --wait-timeout 180

    - >
      docker run --rm
      --network logistic-platform_default
      curlimages/curl:latest
      curl
      --fail
      --retry 10
      --retry-connrefused
      --max-time 10
      http://app:8080/actuator/health

  after_script:
    - docker compose logs --no-color || true
    - docker compose down --volumes --remove-orphans || true


build-and-push:
  stage: publish

  image: docker:27.5.1-cli

  services:
    - name: docker:27.5.1-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  needs:
    - backend-test
    - android-test
    - container-smoke-test

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  script:
    - echo "$CI_JOB_TOKEN" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    - >
      docker build
      --pull
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      --tag "$CI_REGISTRY_IMAGE:latest"
      .

    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"